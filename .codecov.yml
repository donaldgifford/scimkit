---
# $schema=https://www.schemastore.org/codecov.json
# Trend UI only — the enforced floor is scripts/coverage-gate.sh (80% per
# library package). Ignores mirror the gate's exemptions.
coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
ignore:
  - "cmd"
  - "internal/schemagen"
  - "**/*_gen.go"
  - "docs"
  - "scripts"
