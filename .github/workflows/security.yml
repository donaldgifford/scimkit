---
# $schema=https://www.schemastore.org/github-action.json
name: Determine known CVEs through `govulncheck`
on:
  push:
    branches:
      - main
  schedule:
    # Mondays at 0000
    - cron: "0 0 * * 1"
jobs:
  check-for-vulnerabilities:
    name: Check for vulnerabilities using `govulncheck`
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: donaldgifford/govulncheck-action@fe7219aad62f0d90013615d198cee2beea53bf5b # v1
        with:
          # Emit SARIF so findings land in this repo's Code Scanning tab.
          output-format: sarif
          output-file: govulncheck.sarif
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
