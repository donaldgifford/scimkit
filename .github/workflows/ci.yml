---
# $schema=https://www.schemastore.org/github-action.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    name: Label PR
    steps:
      - name: Label PR
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Single source of truth for the linter version is mise.toml.
      - name: Read golangci-lint pin from mise.toml
        id: pin
        run: echo "version=v$(grep -E '^golangci-lint = ' mise.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.pin.outputs.version }}

  test-go:
    name: Test Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # go.mod's `go` floor: the library must build and test on the
          # oldest supported minor. GOTOOLCHAIN=local keeps Go from
          # auto-downloading the newer `toolchain` line, so the floor is
          # exercised for real.
          - go: "1.26"
            primary: false
          # The pinned toolchain (go.mod `toolchain`, mise.toml, Dockerfile)
          # that coverage, generated-code drift, and Codecov gate on.
          - go: "1.27"
            primary: true
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Set up mise (for just)
        if: matrix.primary
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true

      - name: Check generated code is current
        if: matrix.primary
        run: |
          go generate ./...
          git diff --exit-code

      - name: Run unit tests (floor)
        if: ${{ !matrix.primary }}
        run: go test -race ./...

      - name: Run unit tests
        if: matrix.primary
        run: just test-coverage

      - name: Enforce coverage floor
        if: matrix.primary
        run: just coverage-gate

      - name: Upload coverage to Codecov
        if: matrix.primary
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: donaldgifford/scimkit
        continue-on-error: true

  self-check:
    name: Simulator Self-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build CLI
        run: go build -o build/bin/scimkit ./cmd/scimkit

      # The simulator validates the mock and the mock validates the
      # simulator; a wrong-token run must fail to prove detection works.
      - name: Exercise the mock with the built CLI
        run: ./scripts/self-check.sh build/bin/scimkit

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        with:
          source: .
          targets: scimkit-ci
          load: true
          push: false

      - name: Start mock container
        run: |
          docker run -d --name scimkit-mock -p 8080:8080 \
            ghcr.io/donaldgifford/scimkit:dev-ci \
            mock --profile okta --token smoke

      - name: Drive an Okta-shaped create/lookup/patch flow
        run: ./scripts/smoke-http.sh http://127.0.0.1:8080 smoke

      - name: Exercise the container with its own simulator
        run: |
          docker run --rm --network host \
            ghcr.io/donaldgifford/scimkit:dev-ci \
            exercise --target http://127.0.0.1:8080 --token smoke \
            --scenario okta-user-lifecycle

      - name: Mock logs
        if: always()
        run: docker logs scimkit-mock && docker rm -f scimkit-mock

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: donaldgifford/govulncheck-action@fe7219aad62f0d90013615d198cee2beea53bf5b # v1
        with:
          go-version-file: go.mod
          go-package: ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Build snapshot release with SBOMs
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --skip=publish --skip=sign --clean

      - name: Locate archive SBOM
        id: sbom-path
        run: echo "path=$(ls dist/scimkit_*_linux_amd64.tar.gz.spdx.json)" >> "$GITHUB_OUTPUT"

      - name: Scan archive SBOM
        id: scan-sbom
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ steps.sbom-path.outputs.path }}
          severity-cutoff: high
          fail-build: false
          output-format: sarif

      - name: Upload SBOM scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: ${{ steps.scan-sbom.outputs.sarif }}
          category: anchore-archive-sbom
